seed: 42

data:
  image_size: [1024, 1024]
  strict_labels: true
  unlabeled_image_policy: error # error | skip；缺少部分类别 mask 是允许的
  classes: [acne, pigmentation, scar]
  train:
    input_dir: D:/dataset/acne/train/images
    label_dir: D:/dataset/acne/train/labels
    horizontal_flip: 0.5
  val:
    input_dir: D:/dataset/acne/val/images
    label_dir: D:/dataset/acne/val/labels
    horizontal_flip: 0.0
  test:
    input_dir: D:/dataset/acne/test/images
    label_dir: D:/dataset/acne/test/labels
    horizontal_flip: 0.0

dataloader:
  type: standard              # standard | weighted
  train_batch_size: 1
  eval_batch_size: 1
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  positive_sample_weight: 3.0

model:
  type: sam_encoder_segmenter
  pretrained_name: facebook/sam-vit-base
  decoder_channels: 256
  dropout: 0.1
  freeze_encoder: true
  gradient_checkpointing: false
  local_files_only: false
  num_classes: null           # null 时自动等于 1（背景）+ data.classes 数量

loss:
  type: partial_label_ce_dice
  ce_weight: 1.0
  dice_weight: 1.0
  # 列表顺序必须为 [background, *data.classes]；字典中 background 可省略（默认 1）
  class_weights: {background: 1.0, acne: 4.0, pigmentation: 2.0, scar: 3.0}
  smooth: 1.0

optimizer:
  type: adamw
  learning_rate: 0.0001
  encoder_lr_multiplier: 0.1
  weight_decay: 0.01

scheduler:
  type: cosine
  warmup_steps: 500

accelerator:
  mixed_precision: fp16
  gradient_accumulation_steps: 8
  cpu: false
  log_with: null

train:
  output_dir: outputs/sam_acne
  max_steps: 20000
  num_epochs: 100
  val_every_steps: 500
  save_every_steps: 1000
  log_every_steps: 20
  max_grad_norm: 1.0
  metric_for_best: macro_dice
  greater_is_better: true
  resume_from: null

test:
  checkpoint: outputs/sam_acne/best/model.pt
  save_heatmaps: true
  output_dir: outputs/sam_acne/test_heatmaps
  metrics_file: outputs/sam_acne/test_metrics.json
